[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvm-monitor"
version = "0.1.0"
description = "Monitoring et alertes des campagnes CVM Yas Sénégal (Daily Dashboard .xlsb)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyxlsb>=1.0.10",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "watchdog>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
outlook = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
cvm-monitor = "cvm_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvm_monitor = ["notify/templates/*", "dashboard/*.py", "dashboard/pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
