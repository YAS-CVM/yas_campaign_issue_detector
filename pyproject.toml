[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvm-monitor"
version = "0.2.0"
description = "Monitoring et alertes des campagnes CVM Yas Sénégal (Daily Dashboard .xlsb)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyxlsb>=1.0.10",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "watchdog>=4.0",
    "openpyxl>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "starlette>=0.37", "pydantic>=2.0","python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
cvm-monitor = "cvm_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvm_monitor = ["notify/templates/*", "site/templates/*", "site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
